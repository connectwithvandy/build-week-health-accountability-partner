<!doctype html><html><head><meta charset="utf-8"><title>width harness</title>
<style>html,body{margin:0;background:#333}iframe{border:0;display:block;margin:0 auto;background:#fff}</style></head>
<body><iframe id="f" src="/index.html"></iframe>
<script>const w=+(new URLSearchParams(location.search).get('w')||390);const f=document.getElementById('f');
f.width=w;f.height=innerHeight;addEventListener('resize',()=>f.height=innerHeight);</script></body></html>
