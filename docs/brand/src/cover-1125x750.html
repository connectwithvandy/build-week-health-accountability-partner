<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{width:1125px;height:750px;background:var(--paper);
  display:grid;grid-template-columns:1.06fr .94fr;align-items:center;gap:63px;
  padding:73px 73px}
.eyebrow{font-size:16px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;
  color:var(--orange)}
h1{font-family:var(--display);font-weight:900;letter-spacing:-.032em;line-height:.98;
  font-size:100px;margin-top:22px}
h1 .script{font-size:115px;line-height:.9;display:block;margin-top:2px}
.fine{margin-top:33px;font-size:18px;color:var(--ink-2);font-weight:500}
.mark{position:absolute;top:73px;left:73px;font-size:43px}
.thread{background:var(--wa,#ece7de);border:1px solid var(--line);border-radius:18px;
  padding:25px;display:flex;flex-direction:column;gap:13px;
  box-shadow:0 15px 37px rgba(17,19,23,.13)}
.msg{font-size:21px;line-height:1.45;padding:14px 18px;border-radius:15px;
  max-width:88%;width:fit-content}
.them{background:#fff;border-top-left-radius:4px}
.me{background:#cfe9b6;align-self:flex-end;border-top-right-radius:4px}
</style></head><body>
<div class="card grain">
  <div class="mark"><span class="logo">
  <svg viewBox="2 0 48 49" style="width:1.02em;height:1.05em" aria-hidden="true">
    <rect x="4" y="2" width="44" height="34" rx="10" fill="#ff7e3e"/>
    <path d="M13 34 L7 47 L24 35 Z" fill="#ff7e3e"/>
    <g fill="none" stroke="#111317" stroke-width="2.9" stroke-linecap="round">
      <path d="M15 16 Q19 9.5 23 16"/><path d="M29 16 Q33 9.5 37 16"/><path d="M17 22 Q26 32 35 22"/>
    </g>
  </svg><span class="wm" style="font-size:1em;color:#111317"><b>t</b><b>e</b><b>d</b></span></span></div>
  <div>
    <div class="eyebrow">Health accountability that lives in WhatsApp</div>
    <h1>your day,<span class="script">remembered.</span></h1>
    <p class="fine">Free during beta · 18+ · Opens WhatsApp ↗</p>
  </div>
  <div class="thread">
    <div class="msg them">you're 2,100 steps short 🚶 a 19-minute walk closes the gap. shoes on?</div>
    <div class="msg me">going now</div>
    <div class="msg them">8,214 steps 🎯 that walk rescued the bit that was slipping</div>
  </div>
</div></body></html>
