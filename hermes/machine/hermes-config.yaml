model:
  provider: openrouter
  default: anthropic/claude-sonnet-5
  max_tokens: 1024
agent:
  max_turns: 60
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: firecrawl
browser:
  inactivity_timeout: 120
  cloud_provider: browser-use
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  memory_notifications: false
  streaming: true
  skin: default
  interim_assistant_messages: false
  tool_progress: false
  cleanup_progress: false
  long_running_notifications: false
  busy_ack_detail: false
  background_process_notifications: none
  # Ted speaks to people about their food and their day; a provider name, a
  # model id or a retry count in that thread breaks the persona and tells the
  # user nothing they can act on (SOUL.md: "I never expose internal status such
  # as model names, provider names, gateway events"). Plain lines in Ted's
  # voice, per SCOPING.md #27. Full diagnostics still go to
  # ~/.hermes/logs/agent.log. An empty string means "say nothing in chat".
  # A photo is the slowest thing a user can send, so Ted says something before
  # the vision model runs rather than leaving the thread silent. Throttled to
  # one per 90 seconds per chat, so a burst of photos of one plate gets one
  # acknowledgement. Set to an empty string to turn it off.
  media_ack:
    image: "ooh a pic \U0001F440 taking a look, one sec\u2026"
  provider_messages:
    auth: "something's broken on my end, not yours. try me again in a bit."
    policy: "that one didn't land. mind saying it a different way?"
    rate_limit: "too many at once. give me a minute and send it again."
    generic: "my brain's gone quiet for a second \U0001F605 send that again in a minute?"
    stall: ""
tts:
  provider: openai
stt:
  enabled: true
  provider: openai
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
approvals:
  destructive_slash_confirm: false
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
# Ted's reminders must read as Ted, not as system output. The default
# wrapper adds a "Cronjob Response" header, the raw job_id, and footer
# instructions — SOUL.md forbids exposing internal status to the user.
cron:
  wrap_response: false
plugins:
  enabled:
    - ted-safety-gates
stt_echo_transcripts: false
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
  notify: false
group_sessions_per_user: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - cronjob
    - file
    - ted
    - vision
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
image_gen:
  use_gateway: true
known_plugin_toolsets:
  whatsapp:
    - spotify
  cli:
    - spotify
fallback_model:
  provider: openrouter
  model: openai/gpt-5.3-codex
